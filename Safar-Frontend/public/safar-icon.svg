<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Safar"><title>Safar</title><rect x="4" y="4" width="504" height="504" rx="112" fill="#FFFFFF" stroke="#DCE5E0" stroke-width="8"/><g transform="translate(46 30) scale(3.5)">
  <defs>
    <linearGradient id="i-body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0A5C40"/>
      <stop offset=".22" stop-color="#11885F"/>
      <stop offset=".55" stop-color="#0E7A55"/>
      <stop offset="1" stop-color="#063D2B"/>
    </linearGradient>
    <linearGradient id="i-roof" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2A3B35"/>
      <stop offset="1" stop-color="#13201B"/>
    </linearGradient>
    <linearGradient id="i-glass" x1="0" x2=".6" y1="0" y2="1">
      <stop offset="0" stop-color="#D8F0F7"/>
      <stop offset=".45" stop-color="#7FB4C7"/>
      <stop offset="1" stop-color="#2F5A6B"/>
    </linearGradient>
    <linearGradient id="i-nose" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD25C"/>
      <stop offset="1" stop-color="#E9A91F"/>
    </linearGradient>
    <linearGradient id="i-steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3A4A44"/>
      <stop offset="1" stop-color="#121B17"/>
    </linearGradient>
    <radialGradient id="i-lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#F5C542"/>
    </radialGradient>
    <radialGradient id="i-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6CF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF6CF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="i-shell"><path d="M27 96 L28.5 36 Q29.5 22 40 16.5 Q60 11 80 16.5 Q90.5 22 91.5 36 L93 96 Z"/></clipPath>
  </defs>

  <!-- rails in perspective -->
  <path d="M10 120 L46 100 L50 100 L16 120 Z" fill="#5F6E68"/>
  <path d="M110 120 L74 100 L70 100 L104 120 Z" fill="#5F6E68"/>
  <path d="M20 114h80l-3 2.6H23zM31 107.5h58l-2 2H33z" fill="#8A6F55" opacity=".85"/>

  <!-- wheels peeking out -->
  <ellipse cx="33" cy="101" rx="6" ry="3.4" fill="#0B1310"/>
  <ellipse cx="87" cy="101" rx="6" ry="3.4" fill="#0B1310"/>

  <!-- body shell -->
  <path d="M27 96 L28.5 36 Q29.5 22 40 16.5 Q60 11 80 16.5 Q90.5 22 91.5 36 L93 96 Z" fill="url(#i-body)"/>
  <g clip-path="url(#i-shell)">
    <!-- roof cap -->
    <path d="M20 10h80v13.5Q60 17 20 23.5z" fill="url(#i-roof)"/>
    <!-- yellow nose with safety chevrons -->
    <rect x="20" y="70" width="80" height="16" fill="url(#i-nose)"/>
    <g fill="#13201B" opacity=".9">
      <path d="M22 86 L30 70 H35 L27 86z"/><path d="M34 86 L42 70 H47 L39 86z"/>
      <path d="M86 86 L78 70 H73 L81 86z"/><path d="M98 86 L90 70 H85 L93 86z"/>
    </g>
    <!-- white + red cheat lines -->
    <rect x="20" y="86" width="80" height="2.2" fill="#F4F7F5"/>
    <rect x="20" y="88.2" width="80" height="2.6" fill="#E03A3E"/>
    <!-- soft vertical sheen -->
    <rect x="36" y="14" width="6" height="84" fill="#FFFFFF" opacity=".07"/>
  </g>

  <!-- horn + roof unit -->
  <rect x="55" y="10.5" width="10" height="3.5" rx="1.2" fill="#9AA7A1"/>
  <rect x="58.6" y="8.2" width="2.8" height="2.6" rx=".8" fill="#C9D3CE"/>

  <!-- destination board -->
  <rect x="45" y="19.5" width="30" height="6.5" rx="1.6" fill="#0B1310"/>
  <g fill="#FFB347">
    <rect x="48" y="21.8" width="5" height="1.9" rx=".5"/><rect x="54.5" y="21.8" width="7" height="1.9" rx=".5"/>
    <rect x="63" y="21.8" width="9" height="1.9" rx=".5"/>
  </g>

  <!-- windscreen: two panes with a centre pillar -->
  <path d="M33.5 33 Q34 29.5 37.5 29.3 L58.2 28.6 V53 L34 54.6 Q32 54.6 32.2 52.4 Z" fill="url(#i-glass)"/>
  <path d="M86.5 33 Q86 29.5 82.5 29.3 L61.8 28.6 V53 L86 54.6 Q88 54.6 87.8 52.4 Z" fill="url(#i-glass)"/>
  <path d="M58.2 28.6h3.6V53h-3.6z" fill="#0A3C2B"/>
  <!-- reflections -->
  <path d="M37 31.5 L44 31.2 L36 45 L34.6 45 Z" fill="#FFFFFF" opacity=".55"/>
  <path d="M46.5 31 L49.5 30.9 L40 49 L38.6 49 Z" fill="#FFFFFF" opacity=".3"/>
  <path d="M66 30.6 L71 30.4 L64 43 L63 43 Z" fill="#FFFFFF" opacity=".35"/>
  <!-- frame + wipers -->
  <path d="M33.5 33 Q34 29.5 37.5 29.3 L58.2 28.6 V53 L34 54.6 Q32 54.6 32.2 52.4 Z M86.5 33 Q86 29.5 82.5 29.3 L61.8 28.6 V53 L86 54.6 Q88 54.6 87.8 52.4 Z"
        fill="none" stroke="#0A3C2B" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M46 52.6 L53.5 40.5" stroke="#13201B" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M74 52.6 L66.5 40.5" stroke="#13201B" stroke-width="1.1" stroke-linecap="round"/>

  <!-- body panel lines + handrails -->
  <path d="M30 58h60" stroke="#063D2B" stroke-width=".8" opacity=".7"/>
  <path d="M29.6 40 V66 M90.4 40 V66" stroke="#C9D3CE" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>

  <!-- headlight clusters -->
  <circle cx="40" cy="63.5" r="9" fill="url(#i-glow)"/>
  <circle cx="80" cy="63.5" r="9" fill="url(#i-glow)"/>
  <rect x="33" y="59.5" width="14" height="8" rx="3" fill="#0B1310"/>
  <rect x="73" y="59.5" width="14" height="8" rx="3" fill="#0B1310"/>
  <circle cx="37.6" cy="63.5" r="2.7" fill="url(#i-lamp)"/>
  <circle cx="43.4" cy="63.5" r="2" fill="#E03A3E"/>
  <circle cx="82.4" cy="63.5" r="2.7" fill="url(#i-lamp)"/>
  <circle cx="76.6" cy="63.5" r="2" fill="#E03A3E"/>

  <!-- number plate -->
  <rect x="52" y="60" width="16" height="7" rx="1.4" fill="#F4F7F5"/>
  <rect x="54.5" y="62.6" width="11" height="1.8" rx=".6" fill="#0A5C40"/>

  <!-- buffer beam, buffers, coupler -->
  <rect x="25.5" y="91" width="69" height="7.5" rx="1.5" fill="url(#i-steel)"/>
  <rect x="29" y="92.6" width="9" height="4.4" rx="2.2" fill="#C9D3CE"/>
  <rect x="82" y="92.6" width="9" height="4.4" rx="2.2" fill="#C9D3CE"/>
  <rect x="56" y="92" width="8" height="6" rx="1.2" fill="#9AA7A1"/>
  <rect x="58" y="94" width="4" height="2.2" rx=".6" fill="#13201B"/>

  <!-- cowcatcher / pilot -->
  <path d="M30 98.5 H90 L84 106 H36 Z" fill="url(#i-steel)"/>
  <path d="M40 99.5 L43 105.5 M50 99.5 L51.5 105.5 M60 99.5 V105.5 M70 99.5 L68.5 105.5 M80 99.5 L77 105.5"
        stroke="#4B5A54" stroke-width="1.1"/>
</g></svg>
